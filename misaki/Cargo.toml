[package]
name = "misaki-rs"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "readaloud's copy of misaki-rs: misaki's own dictionaries, and espeak-ng-rs for unknown words."
publish = false

[dependencies]
log = "0.4"
regex = "1.10"
num2words = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.13"
espeak-ng = { version = "0.2.0", features = ["bundled-data-en"] }
thiserror = "2.0"

[dev-dependencies]
env_logger = "0.11"
