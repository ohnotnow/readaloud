name: Build

# A push to master builds and tests. A v1.2.3 tag does the same, then publishes the
# tarballs and their SHA256SUMS as a GitHub release, which `readaloud self-update` reads.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]

permissions: {}

# A newer push to master cancels an older run; a release run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the ALSA headers for audio output
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Install Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Run the tests
        run: cargo test --workspace --release

      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # The tag is the only place the version lives; Cargo.toml's stays at 0.0.0.
          # Read by option_env! in src/update.rs; a build without it is a dev build.
          echo "READALOUD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the binary
        run: cargo build --release

      - name: Show what the binary links against
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then ldd target/release/readaloud; else otool -L target/release/readaloud; fi
          target/release/readaloud --version

      - name: Install cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about

      - name: Package the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The licences travel with the binary, as GPL-3.0, Apache-2.0 and MIT require.
          # cargo-about fails here if a crate's licence is not accepted in about.toml.
          mkdir -p "pkg/readaloud" dist
          cp target/release/readaloud README.md LICENSE config.txt pronunciations.txt pkg/readaloud/
          cp misaki/data/LICENSE pkg/readaloud/LICENSE-misaki-dictionaries
          cp misaki/LICENSE pkg/readaloud/LICENSE-misaki-rs
          cp licenses/onnxruntime/LICENSE pkg/readaloud/LICENSE-onnxruntime
          cp licenses/onnxruntime/ThirdPartyNotices.txt pkg/readaloud/ThirdPartyNotices-onnxruntime.txt
          cargo about generate --fail about.hbs -o pkg/readaloud/THIRD-PARTY-LICENSES.txt
          tar -czf "dist/readaloud-$TARGET.tar.gz" -C pkg readaloud

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readaloud-${{ matrix.target }}
          path: dist/readaloud-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write: it creates the release and uploads its files.
    permissions:
      contents: write
    steps:
      - name: Download the three builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum readaloud-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" readaloud-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "readaloud $GITHUB_REF_NAME"
