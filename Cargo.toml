[workspace]
members = ["misaki"]

[package]
name = "readaloud"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Reads text and Markdown documents aloud with the Kokoro text-to-speech model."

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
misaki-rs = { path = "misaki" }
ort = "2.0.0-rc.15"
pulldown-cmark = "0.13.5"
regex = "1.13.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.0"
